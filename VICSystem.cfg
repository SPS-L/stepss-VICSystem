# STEPSS scenario. Save configuration wrote this; Load configuration reads it.
# Paths inside this file's own directory are stored relative to it, so the
# folder can be moved or copied whole. Everything else is absolute.
# Scenario: Victorian transmission system, trip of SM35G1 (500 MW) at 0.5 s. Use nothing.dst for an undisturbed run.

stepss.format = 1

# System data
data.1 = pyRdat_ss.dat
data.2 = pyRdat_dyn.dat
data.3 = SOLVEROPTIONS.dat
disturbance = trip_SM35G1.dst
diagram = 

# Observables
observables.file = obs.dat
runtime.1.type = Machine Speed
runtime.1.name = SM35G2
runtime.2.type = Center of Inertia
runtime.2.name = SM35G2
runtime.3.type = Bus Voltage
runtime.3.name = 35G

# Recording
record.trajectory = true
record.continuous = false
record.discrete = true
record.init = true
